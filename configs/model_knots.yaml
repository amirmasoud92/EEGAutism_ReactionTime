# Spline knot table of the models (modeling/knots.py): knots of every ns() term and the centring medians.
quantile_rule:
  spline: splines::ns(x, knots = interior_knots, Boundary.knots = boundary_knots); no intercept
  interior_knots: pooled quantiles at probabilities k / df, k = 1 .. df - 1 (R quantile type 7)
  boundary_knots: pooled minimum and maximum of the finite values
  rows: the model's trial-table analysis subset (configs/events.yaml) of every child with >= 30 rows and, FAST / IC,
    without behavioural non-performance; pooled over all children; EEG window rules not applied (trial tables only;
    no EEG, no alpha, no group)
  equivalence: on the pooled rows identical to ns(x, df)
  z_scored_terms: t_run and tib are z-scored within child x task over the model rows before ns()
definitions:
  log_tsp: ln(min(t_since_prev_press_ms_concat / 1000, 10)); + prev_press_crosses_join indicator
  soa: soa_prev_ms_concat / 1000 (AVSRT; FAST soa_prev linear, centred at the median)
  t_run: z(trial_index_in_run) within child x task over the model rows
  tib: z(position in block) within child x task over the model rows; AVSRT trial_in_block; FAST position among all images
    of the half-block (block_status x half_status); IC position among the flips of the 180-contour sequence (seq180_index)
  log_tsfl: ln(t_since_prev_flip_ms_concat / 1000) (IC)
  t_since_prev_contour: t_since_prev_contour_ms_concat / 1000 (IC)
  win_start_lag: soa_prev_ms_concat / 1000 + window start (-0.85 s AVSRT, -0.55 s FAST / IC)
